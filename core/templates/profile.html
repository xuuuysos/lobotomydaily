{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль — Lobotomy News</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'core/style.css' %}">
</head>
<body style="overflow: auto;">
    <div class="auth-layout">
        <!-- Sidebar -->
        <div class="auth-sidebar">
            <div class="logo-section" style="cursor: pointer;" onclick="location.href='/'">
                <div class="logo-circle">
                    <img src="{% static 'core/logo.png' %}" alt="Logo">
                </div>
                <div class="logo-text">Lobotomy Daily</div>
            </div>
            
            <div class="auth-slogan">
                Оперативное получение новостей и ежедневной лоботомии
            </div>

            <div></div> <!-- Spacer -->
        </div>
        
        <!-- Main Area -->
        <main class="auth-main" style="padding: 60px 80px;">
            <div style="position: absolute; top: 40px; right: 40px; display: flex; gap: 20px; align-items: center;">
                <form action="{% url 'logout' %}" method="post" style="display: inline;">
                    {% csrf_token %}
                    <button type="submit" class="auth-top-link" style="background:none; border:none; cursor:pointer;">Выйти</button>
                </form>
            </div>
            
            <h1 class="profile-title">Профиль</h1>
            
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 40px; flex-wrap: wrap; gap: 20px;">
                <!-- Left: User Card -->
                <div class="profile-user-card" style="margin-bottom: 0;">
                    <div class="profile-avatar-box" style="display: flex; align-items: center; justify-content: center; background: #e0e6ed; color: #1a2b88;">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                            <circle cx="12" cy="7" r="4" />
                        </svg>
                    </div>
                    <div class="profile-user-info">
                        <h2>{{ user.username }}</h2>
                    </div>
                </div>
                
                <!-- Right: Buttons -->
                <div class="profile-actions-grid" style="margin-bottom: 0; display: flex; gap: 15px; margin-left: auto;">
                    <!-- Bookmarks Card -->
                    <div class="profile-card" style="padding: 16px; min-height: auto; width: 64px; height: 64px;">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/>
                        </svg>
                    </div>
                    <!-- Filters Card -->
                    <div class="profile-card" style="padding: 16px; min-height: auto; width: 64px; height: 64px;">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
                        </svg>
                    </div>
                </div>
            </div>
            
            <div class="profile-feed-header">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ddd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/>
                </svg>
            </div>
            
            <div style="color: #bbb; font-size: 14px; font-style: italic;">
                Вы еще ничего не сохранили.
            </div>
        </main>
    </div>
</body>
</html>
